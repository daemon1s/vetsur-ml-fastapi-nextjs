services:
  vetsur-api:
    image: ghcr.io/daemon1s/vetsur-api:latest
    build: ./api
    mem_limit: 512m
    restart: always
    volumes:
      - ./api/modelo_vetsur.pkl:/app/modelo_vetsur.pkl
      - ./api/columnas_vetsur.json:/app/columnas_vetsur.json
      - ./api/imputaciones_vetsur.json:/app/imputaciones_vetsur.json
      - ./api/caso1_vetsur.csv:/app/caso1_vetsur.csv
      - ./api/data:/app/data
    env_file: .env
    networks:
      - interna

  vetsur-frontend:
    image: ghcr.io/daemon1s/vetsur-frontend:latest
    mem_limit: 512m
    restart: always
    depends_on:
      - vetsur-api
    env_file: .env
    networks:
      - interna

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - vetsur-api
      - vetsur-frontend
    restart: always
    networks:
      - interna
      - proxy-network

networks:
  interna:
    name: vetsur-ml-fastapi-nextjs_internal
    external: true
  proxy-network:
    external: true

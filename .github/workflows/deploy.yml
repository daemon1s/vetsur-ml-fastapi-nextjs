name: Deploy

# Deploy simple al VPS Oracle (ARM64): el build se hace en el VPS.
# Si el healthcheck falla, vuelve al commit anterior automaticamente.
# Se despliega en cada push a main, o a mano desde Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vetsur
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /home/ubuntu/apps/vetsur-ml-fastapi-nextjs
  COMPOSE_FILE: docker-compose.deploy.yml
  HEALTH_URL: https://vetsur.daemonize.me/api/salud

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy con rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ env.APP_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR,COMPOSE_FILE,HEALTH_URL
          script: |
            set -u
            cd "$APP_DIR"

            healthy() {
              for i in $(seq 1 30); do
                [ "$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL")" = "200" ] && return 0
                sleep 2
              done
              return 1
            }

            prev=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            echo "deploy: $prev -> $(git rev-parse HEAD)"

            if docker compose -f "$COMPOSE_FILE" up -d --build && healthy; then
              docker image prune -f
              echo "OK"
              exit 0
            fi

            echo "FALLO. Rollback a $prev"
            git reset --hard "$prev"
            docker compose -f "$COMPOSE_FILE" up -d --build
            healthy && echo "rollback OK" || echo "rollback tambien fallo, revisar a mano"
            exit 1

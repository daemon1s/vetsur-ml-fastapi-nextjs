name: Deploy to VPS (Oracle ARM64)

# Despliegue manual por ahora. Se construye en el propio VPS (ARM64) con
# docker-compose.deploy.yml, igual que el deploy manual. No hay registry ni
# imagenes x86. Reactivar el trigger de push solo tras una prueba exitosa.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vetsur
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/apps/vetsur-ml-fastapi-nextjs
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.deploy.yml up -d --build
            docker image prune -f
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' https://vetsur.daemonize.me/api/salud)
            echo "salud -> $code"
            [ "$code" = "200" ]

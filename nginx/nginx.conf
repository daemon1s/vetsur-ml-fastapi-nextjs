events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Compresión Gzip para mayor velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Configuración del servidor para vetsur.daemonize.me
    server {
        listen 80;
        server_name vetsur.daemonize.me;

        # Necesario para la validación de Certbot (SSL)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir a HTTPS (Descomentar después de generar los certificados)
        # return 301 https://$host$request_uri;

        # Frontend Next.js
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend FastAPI (Mapeado a /api/)
        location /api/ {
            proxy_pass http://api:8008/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
